name: release-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 18 * * 1'

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      core: ${{ steps.scope.outputs.core }}
      native: ${{ steps.scope.outputs.native }}
      docs: ${{ steps.scope.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'ci_*_test.py'
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci_changes.py

  ci:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    uses: ./.github/workflows/ci.yml

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - working-directory: docs
        run: |
          npm ci --no-audit --no-fund
          npm run build

  package-candidate:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      # Agents must accept the minimum_agent_version of generated Wasm modules.
      - name: Build and scan the canonical archive matrix
        env:
          VERSION: 2.0.0
          RELEASE_TAG: v2.0.0
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_READY_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: make release-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ github.sha }}
          path: release-dist/*
          if-no-files-found: error
          retention-days: 7

  integration-linux:
    needs: package-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite: [postgres-1, postgres-2, postgres-3, postgres-4, db-postgres, db-mysql, db-sqlserver, db-oracle, docker, quickstart, stability]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: internal/contract/testdata/schema-validator/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix internal/contract/testdata/schema-validator
      - uses: actions/download-artifact@v5
        with:
          name: release-candidate-${{ github.sha }}
          path: release-dist
      - name: Run one integration partition with extracted distribution binaries
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_READY_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          package_root="$RUNNER_TEMP/onprest-integration-package"
          go run ./internal/releaseverify extract \
            release-dist/onprest-linux-amd64.tar.gz "$package_root" \
            2.0.0 v2.0.0 "$RELEASE_SHA" "$RELEASE_READY_URL" linux/amd64 release-dist/SHA256SUMS
          quickstart_root="$RUNNER_TEMP/onprest-quickstart"
          go run ./internal/releaseverify extract \
            release-dist/onprest-quickstart.tar.gz "$quickstart_root" \
            2.0.0 v2.0.0 "$RELEASE_SHA" "$RELEASE_READY_URL" quickstart release-dist/SHA256SUMS
          install_dir="$package_root/onprest-2.0.0-linux-amd64"
          ONPREST_IT_GATEWAY_BINARY="$install_dir/onprest-gateway" \
            ONPREST_IT_AGENT_BINARY="$install_dir/onprest-agent" \
            ONPREST_IT_QUICKSTART_DIR="$quickstart_root/onprest-2.0.0-quickstart" \
            ONPREST_IT_DISTRIBUTION_VERSION=2.0.0 \
            ONPREST_IT_GATE_LOG_DIR="$PWD/test-results" \
            bash scripts/it_release_gate.sh '${{ matrix.suite }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ github.job }}-${{ strategy.job-index || 0 }}
          path: test-results/
          if-no-files-found: error
          retention-days: 7

  service-lifecycle:
    needs: package-candidate
    uses: ./.github/workflows/service-lifecycle.yml
    with:
      artifact-name: release-candidate-${{ github.sha }}
      version: 2.0.0
      release-tag: v2.0.0
      release-sha: ${{ github.sha }}
      release-ready-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  native-tests:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    name: native-tests (${{ matrix.os }}, ${{ matrix.suite }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest, windows-latest]
        suite: [filesystem, author-cli, wasm-1, wasm-2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - name: Native OS boundary tests without skips
        shell: bash
        run: bash scripts/ci_native_tests.sh '${{ matrix.suite }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ github.job }}-${{ strategy.job-index || 0 }}
          path: test-results/
          if-no-files-found: error
          retention-days: 7

  checks:
    if: always()
    runs-on: ubuntu-latest
    needs: [changes, ci, docs, package-candidate, integration-linux, native-tests, service-lifecycle]
    steps:
      - uses: actions/checkout@v7
      - name: Require every selected check
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_results.py

  # PR checks validate the merge result, not a taggable source-head SHA.
  # Only a full non-PR checkout can supply exact-SHA publication evidence.
  release-ready:
    if: always() && github.event_name != 'pull_request' && needs.changes.outputs.core == 'true' && needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    needs: [changes, checks]
    steps:
      - env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: test "$CHECKS_RESULT" = success
