name: release-gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test-it-release-gate

  service-lifecycle:
    uses: ./.github/workflows/service-lifecycle.yml

  release-ready:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - integration-linux
      - service-lifecycle
    steps:
      - name: Require Linux integration and every service lifecycle job
        env:
          INTEGRATION_RESULT: ${{ needs.integration-linux.result }}
          SERVICE_RESULT: ${{ needs.service-lifecycle.result }}
        run: |
          test "$INTEGRATION_RESULT" = success
          test "$SERVICE_RESULT" = success
