name: service-lifecycle

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-systemd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make build
      - name: Validate crash recovery and path safety on Linux host
        run: go test ./internal/agent -run '^(TestValidateLatestLogCrashRecoveryProcess|TestValidationRecoveryPreservesUnknownAndSpecialTemporaryPaths|TestValidationRejectsInvalidFixedPathsWithoutMutation)$' -count=1
      - name: Build isolated systemd environment
        run: docker build --pull -f scripts/service-test-systemd.Dockerfile -t onprest-service-test-systemd .
      - name: Start isolated systemd and PostgreSQL
        run: |
          docker run --privileged --cgroupns=host -d --name onprest-service-test \
            --tmpfs /run --tmpfs /run/lock \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v "$PWD:/workspace" onprest-service-test-systemd
          for _ in {1..30}; do
            state=$(docker exec onprest-service-test systemctl is-system-running 2>/dev/null || true)
            if [ "$state" = running ] || [ "$state" = degraded ]; then break; fi
            sleep 1
          done
          state=$(docker exec onprest-service-test systemctl is-system-running 2>/dev/null || true)
          if [ "$state" != running ] && [ "$state" != degraded ]; then
            docker logs onprest-service-test
            exit 1
          fi
          docker exec onprest-service-test systemctl start postgresql
          docker exec onprest-service-test runuser -u postgres -- psql -c "ALTER USER postgres PASSWORD 'onprest';"
      - name: Exercise actual systemd lifecycle
        run: |
          docker exec onprest-service-test bash -ec 'chmod +x /workspace/scripts/test_service_lifecycle_unix.sh && /workspace/scripts/test_service_lifecycle_unix.sh /workspace/dist/onprest-agent /workspace/dist/onprest-gateway /workspace/scripts/service-test-capability.yaml'
      - if: always()
        run: docker rm -f onprest-service-test || true

  macos-launchd:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make build
      - name: Validate crash recovery and path safety on macOS host
        run: go test ./internal/agent -run '^(TestValidateLatestLogCrashRecoveryProcess|TestValidationRecoveryPreservesUnknownAndSpecialTemporaryPaths|TestValidationRejectsInvalidFixedPathsWithoutMutation)$' -count=1
      - name: Start PostgreSQL
        run: |
          brew install postgresql@16
          brew services start postgresql@16
          pg_bin="$(brew --prefix postgresql@16)/bin"
          for _ in {1..40}; do "$pg_bin/pg_isready" && break; sleep 0.5; done
          "$pg_bin/psql" postgres -c "CREATE ROLE onprest LOGIN PASSWORD 'onprest';"
      - name: Exercise actual launchd lifecycle
        run: |
          sed -e 's/user: postgres/user: onprest/' scripts/service-test-capability.yaml > dist/capability.input.yaml
          chmod +x scripts/test_service_lifecycle_unix.sh
          ./scripts/test_service_lifecycle_unix.sh ./dist/onprest-agent ./dist/onprest-gateway ./dist/capability.input.yaml

  windows-service:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build Windows binaries
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $version = if ($env:VERSION) { $env:VERSION } else { "dev" }
          $ldflags = "-s -w -X github.com/viewlegacy/onprest/internal/buildinfo.Version=$version"
          go build -trimpath -ldflags $ldflags -o dist/onprest-gateway.exe ./cmd/gateway
          go build -trimpath -ldflags $ldflags -o dist/onprest-agent.exe ./cmd/agent
      - name: Validate crash recovery and path safety on Windows host
        shell: powershell
        run: go test ./internal/agent -run '^(TestValidateLatestLogCrashRecoveryProcess|TestValidationRecoveryPreservesUnknownAndSpecialTemporaryPaths|TestValidationRejectsInvalidFixedPathsWithoutMutation)$' -count=1
      - name: Start preinstalled PostgreSQL
        shell: powershell
        run: |
          $psql = Join-Path $env:PGBIN 'psql.exe'
          $pgIsReady = Join-Path $env:PGBIN 'pg_isready.exe'
          if (-not (Test-Path $psql) -or -not (Test-Path $pgIsReady)) {
            throw "GitHub runner PostgreSQL tools were not found in PGBIN: $env:PGBIN"
          }
          $postgresVersion = Split-Path (Split-Path $env:PGBIN -Parent) -Leaf
          $postgresService = Get-Service -Name "postgresql-x64-$postgresVersion" -ErrorAction SilentlyContinue
          if ($null -eq $postgresService) {
            throw "GitHub runner PostgreSQL service was not found for PGBIN: $env:PGBIN"
          }
          Set-Service -Name $postgresService.Name -StartupType Manual
          Start-Service -Name $postgresService.Name
          for ($i = 0; $i -lt 60; $i++) {
            & $pgIsReady -h 127.0.0.1 -p 5432 | Out-Null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 1
          }
          & $pgIsReady -h 127.0.0.1 -p 5432 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL did not start' }
          $env:PGPASSWORD = 'root'
          & $psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "ALTER USER postgres PASSWORD 'onprest';"
          if ($LASTEXITCODE -ne 0) { throw 'Could not configure the PostgreSQL test password' }
          Remove-Item Env:PGPASSWORD
      - name: Exercise actual Windows Service lifecycle
        shell: powershell
        run: |
          .\scripts\test_service_lifecycle_windows.ps1 -AgentBin .\dist\onprest-agent.exe -GatewayBin .\dist\onprest-gateway.exe -CapabilityFile .\scripts\service-test-capability.yaml
