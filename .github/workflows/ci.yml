name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - name: Independent Go SDK
        working-directory: sdk/go
        run: |
          go test ./...
          go test -race ./...
          go vet ./...
          go mod verify
          GOOS=wasip1 GOARCH=wasm CGO_ENABLED=0 go build ./...
