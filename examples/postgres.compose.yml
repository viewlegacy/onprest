services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: legacy
      POSTGRES_USER: onprest_admin
      POSTGRES_PASSWORD: onprest-example-password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/001-onprest-example.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onprest_admin -d legacy"]
      interval: 1s
      timeout: 5s
      retries: 30
