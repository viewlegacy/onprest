schema_version: 1

service:
  title: Example CRM Capabilities
  version: 0.1.0

gateway:
  url: ws://localhost:8080/ws/agent
  agent_private_key: keEk2aSPeUHiCbhK-XxleMUFj3cwzcJCFUflKSs_CiZOsybztXdoRPcyYZTMd_f9cplE8Qd7VsMz484fWauOvw

sources:
  databases:
    primary:
      driver: postgres
      host: localhost
      port: 5432
      name: legacy
      user: capability_user
      password: onprest-example-password

capabilities:
  get_customer:
    description: Fetch one customer by ID.
    executor:
      type: db
      source: primary
      sql: select id, name, email from customers where id = :customer_id
    input:
      properties:
        customer_id: {type: integer, minimum: 1}
      required: [customer_id]
    policy: {max_rows: 1}
    output:
      data: {}
      items:
        properties:
          id: {type: integer}
          name: {type: string}
          email: {type: string}

  update_customer:
    description: Update one customer's name.
    executor:
      type: db
      source: primary
      sql: update customers set name = :name where id = :customer_id
    input:
      properties:
        customer_id: {type: integer, minimum: 1}
        name: {type: string, minLength: 1, maxLength: 200}
      required: [customer_id, name]
    policy: {readonly: false, max_affected_rows: 1}
    output: {data: {}}
