# Local example configuration. Use your own credentials for deployment.
schema_version: 1

service:
  title: Mutation reconciliation example (MySQL)
  version: 0.1.0
  description: Insert an order and verify its complete business payload by external request ID.

gateway:
  url: ws://127.0.0.1:58080/ws/agent
  agent_private_key: MIwEsQAbbEG-97rXqZb-nkMUYZ2ukfqBp5eMSJCOKNPqa5dvaNFjH6nNhjqa2DMG6UzO0UAhz3cf6IAFcZQlVQ

sources:
  databases:
    primary:
      driver: mysql
      host: 127.0.0.1
      port: 53306
      name: reconcile
      user: capability_user
      password: Onprest-example-1

capabilities:
  create_order:
    description: Insert one order using a caller-chosen unique external request ID.
    executor:
      type: db
      source: primary
      sql: /* onprest_reconciliation_insert */ insert into mutation_reconciliation_orders (external_request_id, product_code, quantity, customer_code) values (:external_request_id, :product_code, :quantity, :customer_code)
    input:
      properties:
        external_request_id: {type: string, pattern: "^req-[0-9]{8}-[0-9]{3}$"}
        product_code: {type: string, maxLength: 64, pattern: "^[A-Z0-9-]+$"}
        quantity: {type: integer, minimum: 1, maximum: 100000}
        customer_code: {type: string, maxLength: 64, pattern: "^[A-Z0-9-]+$"}
      required: [external_request_id, product_code, quantity, customer_code]
    policy: {readonly: false, timeout: 10s}
    output: {data: {}}

  reconcile_order:
    description: Read the complete order payload for reconciliation by external request ID.
    executor:
      type: db
      source: primary
      sql: select external_request_id, product_code, quantity, customer_code from mutation_reconciliation_orders where external_request_id = :external_request_id
    input:
      properties:
        external_request_id: {type: string, pattern: "^req-[0-9]{8}-[0-9]{3}$"}
      required: [external_request_id]
    policy: {max_rows: 1}
    output:
      data: {}
      items:
        properties:
          external_request_id: {type: string}
          product_code: {type: string}
          quantity: {type: integer}
          customer_code: {type: string}
